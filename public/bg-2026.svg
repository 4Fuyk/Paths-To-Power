    <circle cx="1565" cy="330" r="2.5" />
    <circle cx="1590" cy="345" r="3.5" />
    <circle cx="1525" cy="875" r="3.5" />
    <circle cx="1765" cy="135" r="3" />
    <circle cx="1765" cy="190" r="3.5" />
