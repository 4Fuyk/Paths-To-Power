    <circle cx="1260" cy="435" r="4" />
    <circle cx="1285" cy="580" r="3" />
    <circle cx="1345" cy="340" r="3.5" />
    <circle cx="1395" cy="560" r="3" />
    <circle cx="1450" cy="700" r="2.5" />
