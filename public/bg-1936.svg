<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-charcoal" cx="40%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2a3036" />
      <stop offset="60%" stop-color="#1b2024" />
      <stop offset="100%" stop-color="#101316" />
    </radialGradient>
  </defs>

  <!-- Base Dark Gunmetal / Charcoal Canvas -->
  <rect width="1920" height="1080" fill="url(#bg-charcoal)" />

  <!-- Subtle Art Deco Angular Spotlight Beams -->
  <g fill="#ffffff" fill-opacity="0.018">
    <polygon points="0,0 220,0 120,1080 0,1080" />
    <polygon points="180,0 520,0 290,1080 110,1080" />
    <polygon points="1200,0 1920,0 1920,1080 1550,1080" />
  </g>

  <!-- Top Right Radial Sunburst / Industrial Gear Rays (1936 Era) -->
  <g transform="translate(1720, 100)" fill="#786c52" fill-opacity="0.22">
    <!-- 24 Rotated Radial Rays -->
    <path d="M 0 0 L -250 -40 L -250 -75 Z" />
    <path d="M 0 0 L -240 -110 L -215 -145 Z" />
    <path d="M 0 0 L -195 -180 L -160 -210 Z" />
    <path d="M 0 0 L -120 -235 L -80 -255 Z" />
    <path d="M 0 0 L -30 -265 L 15 -265 Z" />
    <path d="M 0 0 L -255 15 L -255 55 Z" />
    <path d="M 0 0 L -240 90 L -220 125 Z" />
    <path d="M 0 0 L -195 160 L -165 190 Z" />
    <path d="M 0 0 L -130 220 L -95 245 Z" />
    <path d="M 0 0 L -50 260 L -10 270 Z" />
    <path d="M 0 0 L 35 270 L 75 260 Z" />
    <path d="M 0 0 L 115 245 L 150 220 Z" />
    <path d="M 0 0 L 185 190 L 210 160 Z" />
    <path d="M 0 0 L 235 125 L 250 90 Z" />
    <path d="M 0 0 L 260 55 L 260 15 Z" />
  </g>

  <!-- Double Outer Framing (Bronze / Gold Art Deco) -->
  <rect x="28" y="28" width="1864" height="1024" fill="none" stroke="#68573a" stroke-width="1.5" stroke-opacity="0.55" />
  <line x1="28" y1="1020" x2="1892" y2="1020" stroke="#7a3b30" stroke-width="1.2" stroke-opacity="0.45" />
</svg>
