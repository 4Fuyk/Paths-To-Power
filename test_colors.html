<!DOCTYPE html>
<html>
<head>
<style>
  body { background: #333; color: white; font-family: sans-serif; display: flex; gap: 20px; padding: 20px; }
  .map-box { width: 300px; height: 300px; border: 2px solid red; overflow: hidden; }
  .map-box img { width: 100%; height: 100%; object-fit: cover; }
  .light img { filter: saturate(1.2) contrast(1.1); }
  .dark img { filter: invert(1) hue-rotate(180deg) brightness(0.9) contrast(1.2); }
</style>
</head>
<body>
  <div>
    <h3>Light Mode</h3>
    <div class="map-box light">
      <img src="https://a.basemaps.cartocdn.com/rastertiles/voyager_nolabels/4/8/5.png" />
    </div>
  </div>
  <div>
    <h3>Dark Mode (Inverted Voyager)</h3>
    <div class="map-box dark">
      <img src="https://a.basemaps.cartocdn.com/rastertiles/voyager_nolabels/4/8/5.png" />
    </div>
  </div>
</body>
</html>
