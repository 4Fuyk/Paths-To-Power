<!DOCTYPE html>
<html>
<body>
<svg viewBox="0 0 1000 500" width="1000" height="500">
  <filter id="shift" filterUnits="userSpaceOnUse" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="2" result="noise" />
    <feOffset dx="0" dy="0" result="movedNoise">
      <animate attributeName="dx" values="0; 500" dur="20s" repeatCount="indefinite" />
    </feOffset>
    <feDisplacementMap in="SourceGraphic" in2="movedNoise" scale="40" xChannelSelector="R" yChannelSelector="G" />
  </filter>
  <g filter="url(#shift)" fill="none" stroke="black">
    <rect x="100" y="100" width="100" height="100" />
    <circle cx="300" cy="150" r="50" />
  </g>
</svg>
</body>
</html>
